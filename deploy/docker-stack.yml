# MiniDash Endado — Docker Swarm stack para VPS personal (master.facundo.click)
#
# Setup confirmado:
#   - Red Traefik:       network_public (postgres tambien esta ahi)
#   - Cert resolver:     letsencryptresolver (HTTP-01 challenge)
#   - Redirect HTTP→HTTPS: global a nivel entrypoint, no hace falta duplicarlo
#   - DB host: postgres_postgres (resuelve por DNS dentro de network_public)
#
# Build local en el VPS (ver deploy/DEPLOY.md). Imagen: mini-dash-api:latest

services:
  api:
    image: mini-dash-api:latest
    env_file:
      - .env
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.minidash-api.rule=Host(`api-minidash.facundo.click`)"
        - "traefik.http.routers.minidash-api.entrypoints=websecure"
        - "traefik.http.routers.minidash-api.tls=true"
        - "traefik.http.routers.minidash-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.minidash-api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  network_public:
    external: true
