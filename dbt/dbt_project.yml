name: 'minidash'
version: '1.0.0'
config-version: 2

profile: 'minidash'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  minidash:
    staging:
      +schema: staging
      +materialized: incremental
    marts:
      +schema: marts
