version: 2

models:
  - name: kpis_diario
    description: "KPIs page-level pre-agregados por filter+dia. Sirve a /metrics/* y /trend/*."
    columns:
      - name: filter
        tests:
          - not_null
          - accepted_values:
              values: ['overall', 'products', 'category', 'recambios']
      - name: event_date
        tests: [not_null]
      - name: clicks
        tests: [not_null]
      - name: impressions
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [filter, event_date]

  - name: top_pages_diario
    description: "Top-pages pre-agregadas por (filter, page, dia). Sirve a /tables/top-products y /tables/top-categories."
    columns:
      - name: filter
        tests:
          - not_null
          - accepted_values:
              values: ['overall', 'products', 'category', 'recambios']
      - name: page
        tests: [not_null]
      - name: event_date
        tests: [not_null]
    tests:
      # Scoped a 30d: ~10M filas no entran en pgsql_tmp con disco actual.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [filter, page, event_date]
          config:
            where: "event_date >= CURRENT_DATE - INTERVAL '30 days'"

  - name: canib_query_page_daily
    description: "MV de proyeccion sobre staging.endado_gsc_query_page_daily con BRIN(event_date)+btree(query). Sirve a /tables/cannibalization (detalle URLs)."
    columns:
      - name: query
        tests: [not_null]
      - name: page
        tests: [not_null]
      - name: event_date
        tests: [not_null]
    tests:
      # Scoped a 30d: 14.6M filas no entran en pgsql_tmp con disco actual.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [query, page, event_date]
          config:
            where: "event_date >= CURRENT_DATE - INTERVAL '30 days'"

  - name: query_daily
    description: "Mart unificada query-level. Reemplaza a kpis_query_diario + canib_query_summary_daily (mismo grano, columnas se fusionan). Sirve a /tables/opportunities y /tables/cannibalization."
    columns:
      - name: query
        tests: [not_null]
      - name: event_date
        tests: [not_null]
      - name: clicks
        tests: [not_null]
      - name: impressions_sum
        tests: [not_null]
      - name: impressions_dedup
        tests: [not_null]
    tests:
      # Scoped a 30d: 14.6M filas no entran en pgsql_tmp con disco actual.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [query, event_date]
          config:
            where: "event_date >= CURRENT_DATE - INTERVAL '30 days'"
