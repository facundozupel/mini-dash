version: 2

models:
  - name: kpis_diario
    description: "KPIs page-level pre-agregados por filter+dia. Sirve a /metrics/* y /trend/*."
    columns:
      - name: filter
        tests:
          - not_null
          - accepted_values:
              values: ['overall', 'products', 'category', 'recambios']
      - name: event_date
        tests: [not_null]
      - name: clicks
        tests: [not_null]
      - name: impressions
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [filter, event_date]

  - name: top_pages_diario
    description: "Top-pages pre-agregadas por (filter, page, dia). Sirve a /tables/top-products y /tables/top-categories."
    columns:
      - name: filter
        tests:
          - not_null
          - accepted_values:
              values: ['overall', 'products', 'category', 'recambios']
      - name: page
        tests: [not_null]
      - name: event_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [filter, page, event_date]

  - name: kpis_query_diario
    description: "KPIs query-level con dedup MAX(impressions) pre-calculado. Sirve a /tables/opportunities."
    columns:
      - name: query
        tests: [not_null]
      - name: event_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [query, event_date]

  - name: canib_query_page_daily
    description: "VIEW de proyeccion sobre staging.endado_gsc_query_page_daily. Sirve a /tables/cannibalization."
