version: 2

sources:
  - name: raw
    schema: public
    description: "Tablas raw de GSC importadas en endado.com (read-only)."

    tables:
      - name: extraccion_gsc
        description: "GSC query+page+date. ~18M filas."
        columns:
          - name: date
            tests:
              - not_null
          - name: query
          - name: page
          - name: clicks
          - name: impressions
          - name: position
          - name: prod_bool
          - name: blog
          - name: kws_brand
          - name: cat
        loaded_at_field: date::timestamp
        freshness:
          warn_after: {count: 4, period: day}
          error_after: {count: 7, period: day}

      - name: extraccion_gsc_page
        description: "GSC page+date (agregado). ~2.7M filas."
        columns:
          - name: date
            tests:
              - not_null
          - name: page
          - name: clicks
          - name: impressions
          - name: position
          - name: prod_bool
          - name: blog
          - name: cat
        loaded_at_field: date::timestamp
        freshness:
          warn_after: {count: 4, period: day}
          error_after: {count: 7, period: day}
